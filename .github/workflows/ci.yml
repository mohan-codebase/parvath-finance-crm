name: Verify CRM
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: parvath
          POSTGRES_DB: parvath_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U parvath -d parvath_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:5177
      DATABASE_URL: postgresql://parvath:test-only-password@localhost:5432/parvath_test
      TEST_DATABASE_URL: postgresql://parvath:test-only-password@localhost:5432/parvath_test
      SESSION_SECRET: ci-only-ephemeral-secret-with-at-least-32-characters
      DEMO_DATE: 2026-09-04T06:30:00.000Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
