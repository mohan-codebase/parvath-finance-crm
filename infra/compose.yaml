name: parvath-finserv
services:
  mongodb:
    image: mongo:8.0
    profiles: [local-db]
    command: ["mongod", "--replSet", "parvathLocal", "--bind_ip_all"]
    ports: ["127.0.0.1:27027:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mongo-init:
    image: mongo:8.0
    profiles: [local-db]
    depends_on:
      mongodb: { condition: service_healthy }
    entrypoint:
      [
        "mongosh",
        "mongodb://mongodb:27017/?directConnection=true",
        "--quiet",
        "--eval",
      ]
    command:
      [
        'try { rs.status() } catch(e) { rs.initiate({_id:"parvathLocal",members:[{_id:0,host:"mongodb:27017"}]}) }',
      ]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["documents:/data"]
    restart: unless-stopped
  bucket-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done; mc mb --ignore-existing local/parvath-private; mc anonymous set none local/parvath-private",
      ]
  clamav:
    image: clamav/clamav:stable
    volumes: ["clamav-data:/var/lib/clamav"]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    profiles: [app]
    env_file: ../.env
    environment:
      PORT: 4007
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: parvath-private
      CLAMAV_HOST: clamav
      SMTP_URL: smtp://mailpit:1025
    ports: ["127.0.0.1:4007:4007"]
    depends_on:
      bucket-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4007/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    profiles: [app]
    command: ["node", "dist/apps/api/src/worker.js"]
    env_file: ../.env
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: parvath-private
      CLAMAV_HOST: clamav
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    profiles: [app]
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  mongo-data:
  documents:
  clamav-data:
